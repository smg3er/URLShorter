services:
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    volumes:
      - redis_volume_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  redis_insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: always
    volumes:
      - redis_insight_volume_data:/data
    ports:
      - "127.0.0.1:8001:5540"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  redis_volume_data:
  redis_insight_volume_data:
